# Kubernetes blueprint for the Invoice Cloud Demo.
# Before applying, replace DOCKERHUB_USERNAME and YOUR-BUCKET-NAME below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-app
  template:
    metadata:
      labels:
        app: invoice-app
    spec:
      containers:
        - name: invoice-app
          image: DOCKERHUB_USERNAME/invoice-app:v1
          ports:
            - containerPort: 5000
          env:
            - name: S3_BUCKET
              value: "YOUR-BUCKET-NAME"
            - name: AWS_REGION
              value: "ap-south-1"
            - name: APP_VERSION
              value: "v1"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          volumeMounts:
            - name: invoice-folder
              mountPath: /app/invoice
      volumes:
        # The invoice folder lives on the EC2 server at /home/ubuntu/invoice,
        # so you can open it with `ls ~/invoice` while the app runs.
        - name: invoice-folder
          hostPath:
            path: /home/ubuntu/invoice
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-app
spec:
  type: NodePort
  selector:
    app: invoice-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
